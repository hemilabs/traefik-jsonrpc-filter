displayName: "JSON-RPC filter"
type: middleware
import: github.com/hemilabs/traefik-jsonrpc-filter
summary: "Allows filtering of JSON-RPC requests"

testData:
  blockedMethods:
    - pattern: "test_*"
    - pattern: "admin_*"
    - pattern: "example_method"
    - pattern: "regex:special_(method|function)"
  maxBodyBytes: 1048576
  blockStatusCode: 403
